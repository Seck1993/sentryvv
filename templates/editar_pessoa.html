<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sentry VV - Editar Alvo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #1a3a5f; color: white; display: flex; align-items: stretch; height: 60px; position: sticky; top: 0; z-index: 1000; }
        .btn-voltar { display: flex; align-items: center; justify-content: center; background: #d9534f; color: white; text-decoration: none; font-weight: bold; font-size: 24px; width: 80px; border-right: 1px solid rgba(255,255,255,0.2); }
        .titulo-header { display: flex; align-items: center; padding-left: 15px; font-size: 18px; font-weight: bold; }
        .container { background: white; padding: 20px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #1a3a5f; font-size: 14px; }
        
        /* Estilos do Editor de Foto */
        .foto-container { text-align: center; margin-bottom: 20px; background: #222; padding: 20px; border-radius: 8px; }
        .foto-label { display: inline-block; width: 100%; padding: 15px; background-color: #1a3a5f; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; box-sizing: border-box; margin-top: 10px; }
        #preview-foto { width: 180px; height: 180px; object-fit: cover; border-radius: 10px; margin: 0 auto; display: block; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        #wrapper-cropper { width: 100%; max-height: 400px; margin-top: 15px; display: none; overflow: hidden; background: #eee; border-radius: 8px; }
        #image-to-crop { max-width: 100%; display: block; }
        .controles-foto { display: none; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-acao-foto { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        input, select, textarea { width: 100%; padding: 15px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #mapa_edicao { height: 280px; width: 100%; border-radius: 8px; margin: 10px 0; border: 2px solid #ccc; z-index: 1; }
        
        /* Botões de Ação */
        .btn-salvar { width: 100%; background-color: #28a745; color: white; padding: 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; margin-top: 20px; cursor: pointer; }
        .btn-vinculos { width: 100%; background-color: #1a3a5f; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 10px; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }
        .btn-excluir { width: 100%; background-color: #d9534f; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }

        /* Estilos do Modal Profissional */
        .modal-foto { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-conteudo { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .btn-modal { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-nova { background: #28a745; color: white; }
        .btn-ajustar { background: #1a3a5f; color: white; }
        .btn-cancelar { background: #6c757d; color: white; }

        /* Estilo Veículos */
        .card-veiculo { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-top: 5px; display: flex; align-items: center; justify-content: space-between; }
        .placa-badge { background: #ffc107; color: black; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="btn-voltar">⬅</a>
        <div class="titulo-header">EDITAR INDIVÍDUO</div>
    </div>

    <div id="modalSelecao" class="modal-foto">
        <div class="modal-conteudo">
            <h3 style="color: #1a3a5f; margin-top: 0;">GESTÃO DE FOTO</h3>
            <p style="color: #666; font-size: 14px;">O que deseja fazer com a imagem do alvo?</p>
            <button type="button" class="btn-modal btn-ajustar" onclick="escolhaAjustar()">✂️ AJUSTAR FOTO ATUAL</button>
            <button type="button" class="btn-modal btn-nova" onclick="escolhaNova()">📸 CARREGAR NOVA FOTO</button>
            <button type="button" class="btn-modal btn-cancelar" onclick="fecharModal()">CANCELAR</button>
        </div>
    </div>

    <div class="container">
        <form action="/atualizar_pessoa/{{ p.id }}" method="POST" id="form-editar">
            <div class="foto-container">
                <img id="preview-foto" src="{{ p.foto_path }}?ts={{ ts }}" alt="Foto Atual">
                <div id="wrapper-cropper"><img id="image-to-crop"></div>
                <div class="controles-foto" id="controles">
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(-90)">↺</button>
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(90)">↻</button>
                    <button type="button" class="btn-acao-foto" style="background:#28a745;" onclick="confirmarCorte()">✅ APLICAR</button>
                </div>
                <label id="label-foto" class="foto-label">📸 ALTERAR OU AJUSTAR FOTO</label>
                <input type="file" id="foto-input" accept="image/*" style="display:none;">
                <input type="hidden" name="foto_editada" id="foto_editada">
            </div>

            <a href="/vincular_tela" class="btn-vinculos">🔗 GERENCIAR VÍNCULOS / RELAÇÕES</a>

            <label>Nome Completo</label>
            <input type="text" name="nome" value="{{ p.nome_completo }}" required>

            <label>Apelido / Vulgo</label>
            <input type="text" name="apelido" value="{{ p.apelido if p.apelido }}">

            <label>Embolamento (Grupo / Facção)</label>
            <input type="text" name="embolamento" value="{{ p.embolamento if p.embolamento }}">

            <label>Modus Operandi</label>
            <textarea name="modus_operandi" rows="3">{{ p.modus_operandi if p.modus_operandi }}</textarea>

            <label>Documento (RG/CPF)</label>
            <input type="text" name="documento" value="{{ p.documento if p.documento }}">

            <label>Veículos Vinculados</label>
            {% if p.veiculos %}
                {% for v in p.veiculos %}
                <div class="card-veiculo">
                    <div><span class="placa-badge">{{ v.placa }}</span> <small>{{ v.marca_modelo }}</small></div>
                    <a href="/editar_veiculo/{{ v.id }}" style="text-decoration:none; font-size:12px; color:#007bff;">EDITAR</a>
                </div>
                {% endfor %}
            {% else %}
                <p style="font-size:12px; color:#999; margin:5px 0;">Nenhum veículo vinculado.</p>
            {% endif %}

            <label>Localização (Arraste o marcador ou clique no mapa)</label>
            <div id="mapa_edicao"></div>
            <div style="display:flex; gap:10px;">
                <div style="width: 50%;"><label>Lat</label><input type="text" name="lat" id="lat" value="{{ p.lat }}" readonly></div>
                <div style="width: 50%;"><label>Lng</label><input type="text" name="lng" id="lng" value="{{ p.lng }}" readonly></div>
            </div>

            <button type="submit" class="btn-salvar">SALVAR ALTERAÇÕES</button>
        </form>
        <a href="javascript:void(0)" class="btn-excluir" onclick="confirmarExclusao()">⚠️ EXCLUIR INDIVÍDUO</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        const modal = document.getElementById('modalSelecao');
        const labelFoto = document.getElementById('label-foto');
        const inputFoto = document.getElementById('foto-input');
        const previewFoto = document.getElementById('preview-foto');
        const wrapper = document.getElementById('wrapper-cropper');
        const imagemParaCorte = document.getElementById('image-to-crop');
        const controles = document.getElementById('controles');

        labelFoto.onclick = function() { modal.style.display = 'flex'; };
        function fecharModal() { modal.style.display = 'none'; }
        function escolhaNova() { fecharModal(); inputFoto.click(); }
        function escolhaAjustar() { fecharModal(); abrirEditor(previewFoto.src); }

        inputFoto.onchange = function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = e => abrirEditor(e.target.result);
                reader.readAsDataURL(files[0]);
            }
        };

        function abrirEditor(src) {
            imagemParaCorte.src = src;
            wrapper.style.display = 'block';
            controles.style.display = 'flex';
            previewFoto.style.display = 'none';
            labelFoto.style.display = 'none';
            if (cropper) cropper.destroy();
            cropper = new Cropper(imagemParaCorte, { aspectRatio: 1, viewMode: 1 });
        }

        function confirmarCorte() {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
                const b64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('foto_editada').value = b64;
                previewFoto.src = b64;
                previewFoto.style.display = 'block';
                wrapper.style.display = 'none';
                controles.style.display = 'none';
                labelFoto.style.display = 'inline-block';
            }
        }

        var mapa = L.map('mapa_edicao', { zoomControl: true }).setView([{{ p.lat }}, {{ p.lng }}], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        var marc = L.marker([{{ p.lat }}, {{ p.lng }}], {draggable: true}).addTo(mapa);

        function atualizarCoordenadas(lat, lng) {
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
        }

        marc.on('dragend', function(e) {
            var pos = marc.getLatLng();
            atualizarCoordenadas(pos.lat, pos.lng);
        });

        mapa.on('click', function(e) {
            var pos = e.latlng;
            marc.setLatLng(pos);
            atualizarCoordenadas(pos.lat, pos.lng);
        });

        function confirmarExclusao() {
            if (confirm("Deseja realmente excluir este indivíduo?")) window.location.href = "/excluir_pessoa/{{ p.id }}";
        }
    </script>
</body>
</html>
