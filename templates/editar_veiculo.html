<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sentry VV - Editar Veículo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 0; margin: 0; }
        .header { background: #1a3a5f; color: white; display: flex; align-items: stretch; height: 60px; position: sticky; top: 0; z-index: 1000; }
        .btn-voltar { display: flex; align-items: center; justify-content: center; background: #d9534f; color: white; text-decoration: none; font-weight: bold; font-size: 24px; width: 80px; border-right: 1px solid rgba(255,255,255,0.2); }
        .titulo-header { display: flex; align-items: center; padding-left: 15px; font-size: 18px; font-weight: bold; }
        .container { background: white; padding: 20px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #1a3a5f; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 15px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: sans-serif; }
        
        /* Gestão de Foto Widescreen 16:9 */
        .foto-container { text-align: center; margin-bottom: 20px; background: #222; padding: 20px; border-radius: 8px; }
        .foto-label { display: inline-block; width: 100%; padding: 15px; background-color: #1a3a5f; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; box-sizing: border-box; margin-top: 10px; }
        
        #preview-foto { width: 100%; max-width: 400px; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin: 0 auto; display: block; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        #wrapper-cropper { width: 100%; max-height: 400px; margin-top: 15px; display: none; overflow: hidden; background: #eee; border-radius: 8px; }
        #image-to-crop { max-width: 100%; display: block; }
        .controles-foto { display: none; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-acao-foto { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .btn-salvar { width: 100%; background-color: #28a745; color: white; padding: 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; margin-top: 20px; cursor: pointer; }
        .btn-excluir { width: 100%; background-color: #d9534f; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 15px; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }
        .tag-info { background: #ffc107; color: black; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; font-family: monospace; border: 1px solid #000; }

        .modal-foto { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-conteudo { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .btn-modal { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="btn-voltar">⬅</a>
        <div class="titulo-header">EDITAR VEÍCULO</div>
    </div>

    <div id="modalSelecao" class="modal-foto">
        <div class="modal-conteudo">
            <h3 style="color: #1a3a5f; margin-top: 0;">FOTO DO VEÍCULO</h3>
            <button type="button" class="btn-modal" style="background:#1a3a5f; color:white;" onclick="escolhaAjustar()">✂️ AJUSTAR ATUAL</button>
            <button type="button" class="btn-modal" style="background:#28a745; color:white;" onclick="escolhaNova()">📸 NOVA FOTO</button>
            <button type="button" class="btn-modal" style="background:#6c757d; color:white;" onclick="fecharModal()">CANCELAR</button>
        </div>
    </div>

    <div class="container">
        <div class="tag-info">PLACA: {{ v.placa }}</div>
        
        <form action="/atualizar_veiculo/{{ v.id }}" method="POST">
            <div class="foto-container">
                <img id="preview-foto" src="{{ v.foto_path }}?ts={{ ts }}" alt="Foto Veículo">
                <div id="wrapper-cropper"><img id="image-to-crop"></div>
                <div class="controles-foto" id="controles">
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(-90)">↺</button>
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(90)">↻</button>
                    <button type="button" class="btn-acao-foto" style="background:#28a745;" onclick="confirmarCorte()">✅ APLICAR</button>
                </div>
                <label id="label-foto" class="foto-label" onclick="abrirModal()">📸 ALTERAR OU AJUSTAR FOTO</label>
                <input type="file" id="foto-input" accept="image/*" style="display:none;">
                <input type="hidden" name="foto_editada" id="foto_editada">
            </div>

            <label>Placa</label>
            <input type="text" name="placa" id="placa" value="{{ v.placa }}" required style="text-transform: uppercase; font-family: monospace; font-weight: bold;">

            <label>Tipo de Veículo</label>
            <select name="tipo">
                <option value="Carro" {% if v.tipo == 'Carro' %}selected{% endif %}>Carro</option>
                <option value="Moto" {% if v.tipo == 'Moto' %}selected{% endif %}>Moto</option>
                <option value="Caminhão" {% if v.tipo == 'Caminhão' %}selected{% endif %}>Caminhão</option>
                <option value="Outro" {% if v.tipo == 'Outro' %}selected{% endif %}>Outro</option>
            </select>

            <label>Marca / Modelo</label>
            <input type="text" name="marca_modelo" value="{{ v.marca_modelo }}">

            <label>Cor do Veículo</label>
            <select name="cor" required>
                <option value="PRATA" {% if v.cor == 'PRATA' %}selected{% endif %}>PRATA</option>
                <option value="PRETO" {% if v.cor == 'PRETO' %}selected{% endif %}>PRETO</option>
                <option value="BRANCO" {% if v.cor == 'BRANCO' %}selected{% endif %}>BRANCO</option>
                <option value="CINZA" {% if v.cor == 'CINZA' %}selected{% endif %}>CINZA</option>
                <option value="VERMELHO" {% if v.cor == 'VERMELHO' %}selected{% endif %}>VERMELHO</option>
                <option value="AZUL" {% if v.cor == 'AZUL' %}selected{% endif %}>AZUL</option>
                <option value="VERDE" {% if v.cor == 'VERDE' %}selected{% endif %}>VERDE</option>
                <option value="AMARELO" {% if v.cor == 'AMARELO' %}selected{% endif %}>AMARELO</option>
                <option value="BEGE" {% if v.cor == 'BEGE' %}selected{% endif %}>BEGE</option>
                <option value="MARROM" {% if v.cor == 'MARROM' %}selected{% endif %}>MARROM</option>
                <option value="LARANJA" {% if v.cor == 'LARANJA' %}selected{% endif %}>LARANJA</option>
                <option value="FANTASIA" {% if v.cor == 'FANTASIA' %}selected{% endif %}>FANTASIA (VÁRIAS CORES)</option>
                <option value="OUTRA" {% if v.cor == 'OUTRA' %}selected{% endif %}>OUTRA / NÃO IDENTIFICADA</option>
            </select>

            <label>Proprietário / Condutor</label>
            <input type="text" id="buscaPessoa" list="listaPessoas" placeholder="🔍 Pesquisar Nome ou Vulgo..." value="{% if v.condutor %}{{ v.condutor.nome_completo }}{% endif %}" oninput="vincularPessoa(this)">
            <input type="hidden" name="pessoa_id" id="pessoa_id_hidden" value="{{ v.pessoa_id if v.pessoa_id else '' }}">
            <datalist id="listaPessoas">
                {% for p in pessoas %}<option data-id="{{ p.id }}" value="{{ p.nome_completo }} {% if p.apelido %}({{ p.apelido }}){% endif %}">{% endfor %}
            </datalist>

            <label>Observações / Modificações</label>
            <textarea name="obs" rows="3">{{ v.obs if v.obs }}</textarea>

            <button type="submit" class="btn-salvar">SALVAR ALTERAÇÕES</button>
        </form>
        <a href="javascript:void(0)" class="btn-excluir" onclick="confirmarExclusaoVeiculo()">⚠️ EXCLUIR VEÍCULO</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        const modal = document.getElementById('modalSelecao');
        const inputFoto = document.getElementById('foto-input');
        const previewFoto = document.getElementById('preview-foto');
        const wrapper = document.getElementById('wrapper-cropper');
        const imagemParaCorte = document.getElementById('image-to-crop');
        const controles = document.getElementById('controles');

        function abrirModal() { modal.style.display = 'flex'; }
        function fecharModal() { modal.style.display = 'none'; }
        function escolhaNova() { fecharModal(); inputFoto.click(); }
        function escolhaAjustar() { fecharModal(); abrirEditor(previewFoto.src); }

        inputFoto.onchange = function (e) {
            const reader = new FileReader();
            reader.onload = e => abrirEditor(e.target.result);
            reader.readAsDataURL(e.target.files[0]);
        };

        function abrirEditor(src) {
            imagemParaCorte.src = src;
            wrapper.style.display = 'block';
            controles.style.display = 'flex';
            previewFoto.style.display = 'none';
            document.getElementById('label-foto').style.display = 'none';
            if (cropper) cropper.destroy();
            cropper = new Cropper(imagemParaCorte, { aspectRatio: 1.777, viewMode: 1 });
        }

        function confirmarCorte() {
            const canvas = cropper.getCroppedCanvas({ width: 800, height: 450 });
            const b64 = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('foto_editada').value = b64;
            previewFoto.src = b64;
            previewFoto.style.display = 'block';
            wrapper.style.display = 'none';
            controles.style.display = 'none';
            document.getElementById('label-foto').style.display = 'inline-block';
        }

        function vincularPessoa(input) {
            var val = input.value;
            var opts = document.getElementById('listaPessoas').childNodes;
            var hidden = document.getElementById('pessoa_id_hidden');
            hidden.value = "";
            for (var i = 0; i < opts.length; i++) {
                if (opts[i].value === val) {
                    hidden.value = opts[i].getAttribute('data-id');
                    break;
                }
            }
        }

        function confirmarExclusaoVeiculo() {
            if (confirm("Deseja realmente remover este veículo?")) window.location.href = "/excluir_veiculo/{{ v.id }}";
        }
    </script>
</body>
</html>
