<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sentry VV - Novo Veículo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        
        .header { 
            background: #1a3a5f; 
            color: white; 
            display: flex; 
            align-items: stretch; 
            height: 60px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-voltar { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #d9534f; 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 24px; 
            width: 80px; 
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .titulo-header { 
            display: flex; 
            align-items: center; 
            padding-left: 15px; 
            font-size: 18px; 
            font-weight: bold; 
        }

        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            margin: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #1a3a5f; 
            font-size: 14px; 
        }
        
        input, select, textarea { 
            width: 100%; 
            padding: 15px; 
            margin: 5px 0 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            -webkit-appearance: none;
        }

        /* Gestão de Foto - Removido aspect-ratio fixo do CSS */
        .foto-container { text-align: center; margin-bottom: 20px; background: #222; padding: 20px; border-radius: 8px; }
        .foto-label { display: inline-block; width: 100%; padding: 15px; background-color: #1a3a5f; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; box-sizing: border-box; }
        #preview-foto { width: 100%; max-width: 400px; height: auto; border-radius: 8px; margin: 0 auto; display: block; border: 3px solid #fff; }
        #wrapper-cropper { width: 100%; max-height: 450px; margin-top: 15px; display: none; overflow: hidden; background: #eee; border-radius: 8px; }
        #image-to-crop { max-width: 100%; display: block; }
        .controles-foto { display: none; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-acao-foto { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .btn-salvar { 
            width: 100%; 
            background-color: #28a745; 
            color: white; 
            padding: 20px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 18px; 
            margin-top: 20px; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="/" class="btn-voltar">⬅</a>
        <div class="titulo-header">VINCULAR NOVO VEÍCULO</div>
    </div>

    <div class="container">
        <form action="/cadastrar_veiculo" method="POST">
            
            <div class="foto-container">
                <img id="preview-foto" src="/static/car_default.png" alt="Prévia Veículo">
                <div id="wrapper-cropper"><img id="image-to-crop"></div>
                <div class="controles-foto" id="controles">
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(-90)">↺</button>
                    <button type="button" class="btn-acao-foto" onclick="cropper.rotate(90)">↻</button>
                    <button type="button" class="btn-acao-foto" style="background:#28a745;" onclick="confirmarCorte()">✅ CONFIRMAR FOTO</button>
                </div>
                <label id="label-foto" class="foto-label" onclick="document.getElementById('foto-input').click()">📸 ADICIONAR FOTO DO VEÍCULO</label>
                <input type="file" id="foto-input" accept="image/*" style="display:none;" onchange="carregarEditor(this)">
                <input type="hidden" name="foto_editada" id="foto_editada">
            </div>

            <label>Placa do Veículo</label>
            <input type="text" name="placa" id="placa" placeholder="Ex: ABC1D23 ou AAA-0000" style="text-transform: uppercase; font-family: monospace; font-weight: bold;" maxlength="8" required>

            <label>Tipo de Veículo</label>
            <select name="tipo">
                <option value="Carro">Carro</option>
                <option value="Moto">Moto</option>
                <option value="Caminhão">Caminhão</option>
                <option value="Outro">Outro</option>
            </select>

            <label>Marca / Modelo</label>
            <input type="text" name="marca_modelo" placeholder="Ex: VW Gol G5" required>

            <label>Cor do Veículo</label>
            <select name="cor" required>
                <option value="" disabled selected>-- SELECIONE A COR --</option>
                <option value="PRATA">PRATA</option>
                <option value="PRETO">PRETO</option>
                <option value="BRANCO">BRANCO</option>
                <option value="CINZA">CINZA</option>
                <option value="VERMELHO">VERMELHO</option>
                <option value="AZUL">AZUL</option>
                <option value="VERDE">VERDE</option>
                <option value="AMARELO">AMARELO</option>
                <option value="BEGE">BEGE</option>
                <option value="MARROM">MARROM</option>
                <option value="LARANJA">LARANJA</option>
                <option value="FANTASIA">FANTASIA (VÁRIAS CORES)</option>
                <option value="OUTRA">OUTRA / NÃO IDENTIFICADA</option>
            </select>

            <label>Vincular ao Indivíduo (Proprietário/Condutor)</label>
            <input type="text" id="buscaPessoa" list="listaPessoas" placeholder="🔍 Pesquisar por Nome ou Vulgo..." oninput="processarVinculo(this)">
            <input type="hidden" name="pessoa_id" id="pessoa_id_final">
            <datalist id="listaPessoas">
                {% for p in pessoas %}
                <option data-id="{{ p.id }}" value="{{ p.nome_completo }} {% if p.apelido %}({{ p.apelido }}){% endif %}"></option>
                {% endfor %}
            </datalist>

            <label>Observações Operacionais / Modificações</label>
            <textarea name="obs" rows="3" placeholder="Ex: Película muito escura, escape barulhento..."></textarea>

            <button type="submit" class="btn-salvar">FINALIZAR E SALVAR</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        const inputFoto = document.getElementById('foto-input');
        const previewFoto = document.getElementById('preview-foto');
        const wrapper = document.getElementById('wrapper-cropper');
        const imagemParaCorte = document.getElementById('image-to-crop');
        const controles = document.getElementById('controles');
        const labelFoto = document.getElementById('label-foto');

        function carregarEditor(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagemParaCorte.src = e.target.result;
                    wrapper.style.display = 'block';
                    controles.style.display = 'flex';
                    previewFoto.style.display = 'none';
                    labelFoto.style.display = 'none';
                    if (cropper) cropper.destroy();
                    
                    // CORREÇÃO: aspectRatio: NaN permite redimensionar o corte livremente
                    cropper = new Cropper(imagemParaCorte, { 
                        aspectRatio: NaN, 
                        viewMode: 1,
                        autoCropArea: 1,
                        dragMode: 'move',
                        responsive: true
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function confirmarCorte() {
            if (cropper) {
                // CORREÇÃO: Removido width/height fixos para não distorcer nem limitar o tamanho
                const canvas = cropper.getCroppedCanvas({
                    imageSmoothingEnabled: true,
                    imageSmoothingQuality: 'high',
                });
                
                const b64 = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('foto_editada').value = b64;
                
                previewFoto.src = b64;
                previewFoto.style.display = 'block';
                wrapper.style.display = 'none';
                controles.style.display = 'none';
                labelFoto.style.display = 'inline-block';
            }
        }

        function processarVinculo(input) {
            var val = input.value;
            var opts = document.getElementById('listaPessoas').childNodes;
            var hiddenField = document.getElementById('pessoa_id_final');
            hiddenField.value = "";
            for (var i = 0; i < opts.length; i++) {
                if (opts[i].value === val) {
                    hiddenField.value = opts[i].getAttribute('data-id');
                    break;
                }
            }
        }

        document.getElementById('placa').addEventListener('input', function (e) {
            var value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (value.length > 3 && !isNaN(value[3])) {
                e.target.value = value.slice(0, 3) + '-' + value.slice(3, 7);
            } else {
                e.target.value = value.slice(0, 7);
            }
        });
    </script>
</body>
</html>
